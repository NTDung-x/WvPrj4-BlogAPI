info:
  name: Get list posts by Tags
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/posts?tag=Nodejs"
  params:
    - name: tag
      value: Nodejs
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
